<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In · Bucksy</title>
  <meta name="description" content="Sign in to your Bucksy personal finance dashboard.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-wrapper">
    <div style="position: absolute; top: 20px; right: 20px;">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle dark/light mode">◐</button>
    </div>

    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">₿</div>
        <h2>Welcome to Bucksy</h2>
        <p>Sign in to access your dashboard & savings</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack" style="margin-bottom: 20px;">
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('login', next=next) }}" class="auth-form" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label class="auth-label">
          <span>Email Address</span>
          <input type="email" name="email" value="{{ email or '' }}" placeholder="name@example.com" required autofocus maxlength="120">
        </label>

        <label class="auth-label">
          <span>Password</span>
          <div class="password-input-wrap">
            <input type="password" name="password" id="login-password" placeholder="Enter your password" required>
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility(this, 'login-password')" title="Show or hide password">👁</button>
          </div>
        </label>

        <div class="remember-forgot-row">
          <label class="remember-label">
            <input type="checkbox" name="remember_me" value="1" checked>
            <span>Remember me</span>
          </label>
          <a href="{{ url_for('forgot_password') }}" class="text-link" style="font-size:12px;">Forgot password?</a>
        </div>

        <button type="submit" class="button primary full" style="padding: 13px 18px; font-size: 14px; margin-top: 4px;">
          Sign In ➔
        </button>
      </form>

      <div class="auth-footer-links">
        Don't have an account? <a href="{{ url_for('register') }}">Create an account</a>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
