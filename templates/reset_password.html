<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set New Password · Bucksy</title>
  <meta name="description" content="Set a new secure password for your Bucksy account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-wrapper">
    <div style="position: absolute; top: 20px; right: 20px;">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle dark/light mode">◐</button>
    </div>

    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">🛡️</div>
        <h2>New Password</h2>
        <p>Choose a strong password to secure your account</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack" style="margin-bottom: 20px;">
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('reset_password', token=token) }}" class="auth-form" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label class="auth-label">
          <span>New Password <span class="req">*</span></span>
          <div class="password-input-wrap">
            <input type="password" name="password" id="reset-password" placeholder="At least 8 characters" required minlength="8" autofocus
                   oninput="updatePasswordStrength(this.value, 'reset-strength-fill', 'reset-strength-text')">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility(this, 'reset-password')" title="Show or hide password">👁</button>
          </div>
          <div class="password-strength-bar">
            <div class="password-strength-fill" id="reset-strength-fill"></div>
          </div>
          <div class="password-strength-text" id="reset-strength-text"></div>
        </label>

        <label class="auth-label">
          <span>Confirm New Password <span class="req">*</span></span>
          <div class="password-input-wrap">
            <input type="password" name="confirm_password" id="reset-confirm" placeholder="Re-enter your new password" required minlength="8">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility(this, 'reset-confirm')" title="Show or hide password">👁</button>
          </div>
        </label>

        <button type="submit" class="button primary full" style="padding: 13px 18px; font-size: 14px; margin-top: 6px;">
          Update Password ➔
        </button>
      </form>

      <div class="auth-footer-links">
        Return to <a href="{{ url_for('login') }}">Sign In</a>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
